name: Build GitHub Pages Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".nojekyll"
      - "404.html"
      - "_next/**"
      - "about/**"
      - "cart/**"
      - "categories/**"
      - "checkout/**"
      - "contact/**"
      - "favicon.ico"
      - "icon.jpg"
      - "index.html"
      - "privacy-policy/**"
      - "products/**"
      - "robots.txt"
      - "shop/**"
      - "sitemap.xml"
      - "terms-and-conditions/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and commit static export
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Copy export to repository root
        run: |
          rm -rf 404.html _next _not-found about cart categories checkout contact privacy-policy products shop terms-and-conditions
          rm -f favicon.ico icon.jpg index.html robots.txt sitemap.xml
          cp -R out/. .
          touch .nojekyll

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll 404.html _next _not-found about cart categories checkout contact favicon.ico icon.jpg index.html privacy-policy products robots.txt shop sitemap.xml terms-and-conditions
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
          else
            git commit -m "Update GitHub Pages static site [skip ci]"
            git push
          fi
